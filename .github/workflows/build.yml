name: 一键出包 · 星河影视（基于 TVBox）

# 你在 GitHub 仓库页面点一下就能跑；跑完下载 APK 即可安装。
on:
  workflow_dispatch:        # 支持页面手动 "Run workflow"
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # 1) 检出"你自己的仓库"（里面有 customize.py 和本工作流文件）
      - name: 检出本仓库
        uses: actions/checkout@v4

      # 2) 拉取 TVBox 基础源码到 box/ 子目录（你不用自己 fork，脚本帮你拉）
      - name: 拉取 TVBox 基础源码
        uses: actions/checkout@v4
        with:
          repository: takagen99/Box      # 想换基础，改这一行（如 CatVodTVOfficial/CatVodTV）
          submodules: recursive
          fetch-depth: 0
          path: box

      # 3) 自动改名 / 配色 / 默认设置（customize.py 已写好，无需你动手）
      #    若没传 customize.py 也不会中断，照样能出包（只是未改名）
      - name: 自动个性化（改名/配色/默认设置）
        run: python3 customize.py || true

      # 4) 准备编译环境
      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: 安装编译组件
        run: |
          sdkmanager --install "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      # 5) 编译（在 box/ 目录里）
      - name: 赋予 gradlew 权限
        run: chmod +x box/gradlew

      # 先尝试 Release（体积小、更正式）；如果 Release 因为签名/R8/代码检查失败，
      # 自动转 Debug（对个人使用完全够用，安装时开"允许未知来源"即可）。
      - name: 编译 APK（Release 优先，失败则 Debug 兜底）
        run: cd box && ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      # 6) 把成品 APK 交给你（Release 和 Debug 都收集，哪个成功就给哪个）
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: xinghe-tvbox-apk
          path: |
            box/app/build/outputs/apk/release/*.apk
            box/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
